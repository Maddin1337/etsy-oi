[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[paths]
provisioning = ops/grafana/provisioning

